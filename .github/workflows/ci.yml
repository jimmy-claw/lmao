name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check rustdoc warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --workspace --out xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  logos-dev-boost:
    name: Logos Dev Boost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify logos-dev-boost files
        run: |
          test -f CLAUDE.md
          test -f AGENTS.md
          test -f .mcp.json
          test -d .claude/skills
          echo "All logos-dev-boost files present"
      - name: Validate MCP config
        run: |
          node -e "const c = require('./.mcp.json'); if (!c.mcpServers['logos-dev-boost']) { process.exit(1); }"
          echo "MCP config valid"

  # Optional: end-to-end tests with nwaku Docker (manual trigger only)
  test-e2e:
    name: E2E Tests (nwaku)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      nwaku:
        image: statusteam/nim-waku:v0.31.0
        ports:
          - 8645:8645
        options: >-
          --health-cmd "curl -f http://localhost:8645/debug/v1/info || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run E2E tests
        run: cargo test --workspace
        env:
          WAKU_URL: http://localhost:8645
